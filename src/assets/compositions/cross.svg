<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- 垂直中线 -->
  <line x1="50" y1="0" x2="50" y2="100" stroke="#F5C842" stroke-width="1" stroke-opacity="0.85"/>
  <!-- 水平中线 -->
  <line x1="0" y1="50" x2="100" y2="50" stroke="#F5C842" stroke-width="1" stroke-opacity="0.85"/>
  <!-- 十字中心点 -->
  <circle cx="50" cy="50" r="2" fill="#F5C842" fill-opacity="0.9"/>
</svg>
