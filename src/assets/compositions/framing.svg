<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!--
    框中框：外层元素（如树、门廊、拱门）框住中心主体
    用圆角矩形模拟前景框，内部虚线框示意主体位置
  -->
  <!-- 外框（前景遮挡元素） -->
  <rect x="4" y="4" width="92" height="92" rx="3"
        stroke="#F5C842" stroke-width="1.2" stroke-opacity="0.85" fill="none"/>
  <!-- 内框（被框住的主体） -->
  <rect x="22" y="20" width="56" height="60" rx="1"
        stroke="#F5C842" stroke-width="0.8" stroke-opacity="0.7"
        fill="#F5C842" fill-opacity="0.05"
        stroke-dasharray="5 2"/>
  <!-- 四角厚边示意前景框元素 -->
  <rect x="4"  y="4"  width="14" height="88" fill="#F5C842" fill-opacity="0.07"/>
  <rect x="82" y="4"  width="14" height="88" fill="#F5C842" fill-opacity="0.07"/>
  <rect x="4"  y="4"  width="92" height="12" fill="#F5C842" fill-opacity="0.07"/>
  <rect x="4"  y="84" width="92" height="12" fill="#F5C842" fill-opacity="0.07"/>
  <!-- 中心焦点 -->
  <circle cx="50" cy="50" r="1.5" fill="#F5C842" fill-opacity="0.8"/>
</svg>
