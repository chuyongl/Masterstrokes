<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- 8条放射线，从中心(50,50)向外延伸 -->
  <line x1="50" y1="50" x2="50"  y2="0"   stroke="#F5C842" stroke-width="0.8" stroke-opacity="0.85"/>
  <line x1="50" y1="50" x2="100" y2="50"  stroke="#F5C842" stroke-width="0.8" stroke-opacity="0.85"/>
  <line x1="50" y1="50" x2="50"  y2="100" stroke="#F5C842" stroke-width="0.8" stroke-opacity="0.85"/>
  <line x1="50" y1="50" x2="0"   y2="50"  stroke="#F5C842" stroke-width="0.8" stroke-opacity="0.85"/>
  <line x1="50" y1="50" x2="100" y2="0"   stroke="#F5C842" stroke-width="0.6" stroke-opacity="0.6"/>
  <line x1="50" y1="50" x2="100" y2="100" stroke="#F5C842" stroke-width="0.6" stroke-opacity="0.6"/>
  <line x1="50" y1="50" x2="0"   y2="100" stroke="#F5C842" stroke-width="0.6" stroke-opacity="0.6"/>
  <line x1="50" y1="50" x2="0"   y2="0"   stroke="#F5C842" stroke-width="0.6" stroke-opacity="0.6"/>
  <!-- 中心点 -->
  <circle cx="50" cy="50" r="2" fill="#F5C842" fill-opacity="0.9"/>
</svg>
