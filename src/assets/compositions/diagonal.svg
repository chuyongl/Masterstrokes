<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- 主对角线 左上→右下 -->
  <line x1="0" y1="0" x2="100" y2="100" stroke="#F5C842" stroke-width="1" stroke-opacity="0.85"/>
  <!-- 辅助对角线 右上→左下（较细，辅助） -->
  <line x1="100" y1="0" x2="0" y2="100" stroke="#F5C842" stroke-width="0.5" stroke-opacity="0.45" stroke-dasharray="3 3"/>
</svg>
