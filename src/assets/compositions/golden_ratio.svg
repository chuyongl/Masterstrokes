<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!--
    黄金比例近似分割：phi ≈ 1.618
    主矩形 100×100，第一条竖线在 100/1.618 ≈ 61.8
    右侧剩余 38.2，第一条横线在 38.2/1.618 ≈ 23.6（从底部算）= 76.4 from top
    以此类推，螺旋越缩越小
  -->
  <!-- 主分割竖线 phi -->
  <line x1="61.8" y1="0" x2="61.8" y2="100" stroke="#F5C842" stroke-width="0.9" stroke-opacity="0.85"/>
  <!-- 右侧横线 -->
  <line x1="61.8" y1="61.8" x2="100" y2="61.8" stroke="#F5C842" stroke-width="0.8" stroke-opacity="0.75"/>
  <!-- 右下竖线 -->
  <line x1="76.4" y1="61.8" x2="76.4" y2="100" stroke="#F5C842" stroke-width="0.7" stroke-opacity="0.65"/>
  <!-- 右下横线 -->
  <line x1="61.8" y1="85.4" x2="76.4" y2="85.4" stroke="#F5C842" stroke-width="0.6" stroke-opacity="0.55"/>
  <!-- 螺旋弧线（近似黄金螺旋） -->
  <path
    d="M 61.8 0 Q 0 0 0 61.8 Q 0 100 61.8 100 Q 100 100 100 61.8 Q 100 38 76.4 38 Q 61.8 38 61.8 61.8"
    stroke="#F5C842"
    stroke-width="0.7"
    stroke-opacity="0.5"
    stroke-dasharray="2 2"
    fill="none"
  />
  <!-- 黄金点标记 -->
  <circle cx="61.8" cy="61.8" r="2" fill="#F5C842" fill-opacity="0.9"/>
</svg>
