<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- X形：两条对角线等权重 -->
  <line x1="0"   y1="0"   x2="100" y2="100" stroke="#F5C842" stroke-width="1" stroke-opacity="0.85"/>
  <line x1="100" y1="0"   x2="0"   y2="100" stroke="#F5C842" stroke-width="1" stroke-opacity="0.85"/>
  <!-- 中心点 -->
  <circle cx="50" cy="50" r="2" fill="#F5C842" fill-opacity="0.9"/>
</svg>
