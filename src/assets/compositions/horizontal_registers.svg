<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- 3层水平分割带：用实线分隔，每层背景subtle填色示意 -->
  <rect x="4" y="4"  width="92" height="27" stroke="#F5C842" stroke-width="0.8" stroke-opacity="0.7" fill="#F5C842" fill-opacity="0.06"/>
  <rect x="4" y="35" width="92" height="27" stroke="#F5C842" stroke-width="0.8" stroke-opacity="0.7" fill="#F5C842" fill-opacity="0.04"/>
  <rect x="4" y="66" width="92" height="27" stroke="#F5C842" stroke-width="0.8" stroke-opacity="0.7" fill="#F5C842" fill-opacity="0.06"/>
  <!-- 分隔线加粗 -->
  <line x1="4" y1="34"  x2="96" y2="34"  stroke="#F5C842" stroke-width="1" stroke-opacity="0.85"/>
  <line x1="4" y1="65"  x2="96" y2="65"  stroke="#F5C842" stroke-width="1" stroke-opacity="0.85"/>
</svg>
