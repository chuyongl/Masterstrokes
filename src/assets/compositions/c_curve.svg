<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!--
    C形曲线：从右上经过中左再到右下
    贝塞尔曲线模拟镜头引导线
  -->
  <path
    d="M 80 8 Q 10 15 15 50 Q 10 85 80 92"
    stroke="#F5C842"
    stroke-width="1"
    stroke-opacity="0.85"
    fill="none"
    stroke-linecap="round"
  />
  <!-- 起点终点标记 -->
  <circle cx="80" cy="8"  r="1.5" fill="#F5C842" fill-opacity="0.9"/>
  <circle cx="80" cy="92" r="1.5" fill="#F5C842" fill-opacity="0.9"/>
  <!-- 曲线最左侧标记（兴趣点） -->
  <circle cx="13" cy="50" r="1.5" fill="#F5C842" fill-opacity="0.7"/>
</svg>
