<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!--
    S形曲线：从左下 → 右中 → 左上
    两段贝塞尔拼成S形
  -->
  <path
    d="M 20 95 Q 90 80 50 50 Q 10 20 80 5"
    stroke="#F5C842"
    stroke-width="1"
    stroke-opacity="0.85"
    fill="none"
    stroke-linecap="round"
  />
  <!-- 起点终点标记 -->
  <circle cx="20" cy="95" r="1.5" fill="#F5C842" fill-opacity="0.9"/>
  <circle cx="80" cy="5"  r="1.5" fill="#F5C842" fill-opacity="0.9"/>
  <!-- 中间拐点 -->
  <circle cx="50" cy="50" r="1.5" fill="#F5C842" fill-opacity="0.7"/>
</svg>
