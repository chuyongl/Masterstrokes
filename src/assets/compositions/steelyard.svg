<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!--
    杠杆平衡：水平横梁 + 支点 + 左侧近距大圆 + 右侧远距小圆
    力矩=质量×距离，所以右侧小物体更远才能平衡
  -->
  <!-- 支点三角 -->
  <polygon points="50,75 44,88 56,88" stroke="#F5C842" stroke-width="0.8" stroke-opacity="0.85" fill="#F5C842" fill-opacity="0.15"/>
  <!-- 横梁 -->
  <line x1="8" y1="68" x2="92" y2="68" stroke="#F5C842" stroke-width="1.1" stroke-opacity="0.9"/>
  <!-- 左侧大圆（近，重） -->
  <circle cx="22" cy="55" r="11" stroke="#F5C842" stroke-width="0.9" stroke-opacity="0.85" fill="#F5C842" fill-opacity="0.1"/>
  <line x1="22" y1="66" x2="22" y2="68" stroke="#F5C842" stroke-width="0.9" stroke-opacity="0.7"/>
  <!-- 右侧小圆（远，轻） -->
  <circle cx="78" cy="60" r="6" stroke="#F5C842" stroke-width="0.9" stroke-opacity="0.85" fill="#F5C842" fill-opacity="0.08"/>
  <line x1="78" y1="66" x2="78" y2="68" stroke="#F5C842" stroke-width="0.9" stroke-opacity="0.7"/>
  <!-- 距离标注虚线 -->
  <line x1="22" y1="92" x2="50" y2="92" stroke="#F5C842" stroke-width="0.5" stroke-opacity="0.4" stroke-dasharray="2 2"/>
  <line x1="50" y1="92" x2="78" y2="92" stroke="#F5C842" stroke-width="0.5" stroke-opacity="0.4" stroke-dasharray="2 2"/>
</svg>
